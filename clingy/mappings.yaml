group_descriptions:
  opencode: "Opencode configurations in `~/.config/opencode/`"
  claude: "Claude adapted configurations in `~/.claude/`"
  antigravity: "Antigravity IDE powered by Gemini"

configs:
  ############
  # Opencode #
  ############
  - name: opencode-agents
    source: ../agent/
    target: ~/.config/opencode/agent/
    group: opencode
  - name: opencode-skills
    source: ../skill/
    target: ~/.config/opencode/skill/
    group: opencode
  - name: opencode-themes
    source: ../themes/
    target: ~/.config/opencode/themes/
    group: opencode
  - name: opencode-config
    source: ../configs/opencode/opencode.json
    target: ~/.config/opencode/opencode.json
    group: opencode
  - name: opencode-tui
    source: ../configs/opencode/tui.json
    target: ~/.config/opencode/tui.json
    group: opencode

  ##########
  # Claude #
  ##########
  - name: claude-main-agent
    source: ../agent/clu.md
    target: ~/.claude/CLAUDE.md
    group: claude
  - name: claude-skills
    source: ../skill/
    target: ~/.claude/skills/
    group: claude
  - name: claude-agents
    source: ../agent/
    target: ~/.claude/agents/
    group: claude
  # Config
  - name: claude-settings
    source: ../configs/claude/settings.json
    target: ~/.claude/settings.json
    group: claude
  - name: claude-statusline
    source: ../configs/claude/statusline-command.sh
    target: ~/.claude/statusline-command.sh
    group: claude
  - name: claude-mcp
    source: ../configs/claude/mcp.json
    target: ~/.claude/.mcp.json
    group: claude

  ###############
  # Antigravity #
  ###############
  - name: antigravity-mcp
    source: ../agent/clu.md
    target: ~/.gemini/GEMINI.md
    group: antigravity
  - name: antigravity-skills
    source: ../skill/
    target: ~/.gemini/antigravity/skills/
    group: antigravity
